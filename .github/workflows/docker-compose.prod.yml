version: '3.8'

services:
  app:
    image: ${DOCKER_USERNAME}/phase6-backend:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - db
    restart: always
    command: gunicorn -w 4 -b 0.0.0.0:8000 src.app:app

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

  frontend:
    image: ${DOCKER_USERNAME}/phase6-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always

volumes:
  postgres_data:
