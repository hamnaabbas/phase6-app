services:
  - type: web
    name: phase7-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT src.app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phase7-db
          property: connectionString

  - type: web
    name: phase7-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: phase7-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: phase7-db
    databaseName: phase7db
    user: phase7user
