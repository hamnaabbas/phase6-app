server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Railway backend
    location /api {
        proxy_pass https://web-production-b3b40.up.railway.app/health
        proxy_http_version 1.1;
        proxy_set_header Host https://web-production-b3b40.up.railway.app/health;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass https://web-production-b3b40.up.railway.app/health/health;
    }

    location /docs {
        proxy_pass https://web-production-b3b40.up.railway.app/health/docs;
    }
}

